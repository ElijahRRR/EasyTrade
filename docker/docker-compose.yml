# ------------------------------------------------------------------
# binance-quant 的 Docker Compose 文件（VPS 和 Mac 通用）
#
# 请在【项目根目录】执行（推荐用 Makefile 的快捷命令，见 README）：
#   docker compose -f docker/docker-compose.yml run --rm cli <freqtrade 子命令>   # 一次性命令：下载数据、回测…
#   docker compose -f docker/docker-compose.yml up -d ui          # FreqUI 看回测结果（127.0.0.1:8080）
#   docker compose -f docker/docker-compose.yml up -d freqtrade   # 机器人（币安合约，默认模拟盘）
#   docker compose -f docker/docker-compose.yml logs -f freqtrade
#   docker compose -f docker/docker-compose.yml down
#
# 三个服务都设置了 profiles，所以单独执行 "up -d" 不会误启动任何东西，必须写明服务名。
# ui 和 freqtrade 都占用 8080 端口，不能同时运行。
#
# 安全：
#   * 端口只映射到宿主机 127.0.0.1:8080，公网无法访问；远程请用 SSH 隧道（见 README）。
#   * 容器里 API 监听 0.0.0.0 是为了让端口映射生效，外部仍然只能经 127.0.0.1 访问。
#   * 所有密钥来自项目根目录的 .env（已在 .gitignore 里），不要写进本文件。
#     只有 ui / freqtrade 服务读取 .env；它们启动前先运行 scripts/preflight.sh 做安全检查，
#     并由它根据 Telegram token / chat id 拼出中文通知用的 FREQTRADE__WEBHOOK__URL。
#   * 美国 IP 访问币安会被拒（HTTP 451）。freqtrade 服务只能在币安允许的地区运行，
#     不要用代理/VPN 绕过。
# ------------------------------------------------------------------
name: binance-quant

x-freqtrade-base: &ft-base
  # 版本与 requirements.txt 保持一致；升级时两处一起改
  image: freqtradeorg/freqtrade:2026.10
  working_dir: /freqtrade
  volumes:
    - "../user_data:/freqtrade/user_data"
    - "../configs:/freqtrade/configs:ro"
    - "../scripts:/freqtrade/scripts:ro"

# 只有 ui / freqtrade 读取 .env（cli 跑回测不需要任何密钥，也就不注入）
x-env: &ft-env
  env_file:
    - path: ../.env
      required: false

services:
  # 一次性命令：download-data / backtesting / list-data / show-config ...
  cli:
    <<: *ft-base
    profiles: ["cli"]
    command: ["--version"]

  # FreqUI 网页，加载 user_data/backtest_results 里的回测结果（第一阶段用，美国 VPS 可用）
  ui:
    <<: [*ft-base, *ft-env]
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__API_SERVER__ENABLED: "true"
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
    entrypoint: ["/bin/sh", "/freqtrade/scripts/preflight.sh"]
    command:
      - freqtrade
      - webserver
      - --config
      - configs/config.okx-backtest.json
      - --logfile
      - user_data/logs/webserver.log

  # 交易机器人（币安 USDT-M 合约，默认 dry-run 模拟盘；策略名来自 .env 的 FREQTRADE__STRATEGY）
  freqtrade:
    <<: [*ft-base, *ft-env]
    profiles: ["trade"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: "0.0.0.0"
    entrypoint: ["/bin/sh", "/freqtrade/scripts/preflight.sh"]
    command:
      - freqtrade
      - trade
      - --config
      - configs/config.binance-futures.json
      - --logfile
      - user_data/logs/freqtrade.log
